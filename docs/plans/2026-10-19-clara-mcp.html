:root[data-theme="dark"]{--bg:#111316;--panel:#1a1d22;--panel2:#22262c;--line:#2e333a;--text:#e6e8eb;--mute:#9aa3ad;--acc:#f5a524;--accbg:#3a2a0c;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1380px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;border-right:1px solid var(--line);font-size:13px}
nav.side a{display:flex;gap:8px;align-items:center;color:var(--text);text-decoration:none;padding:4px 8px;border-radius:6px}

.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}.dot.ok{background:var(--lior)}.dot.change{background:var(--mine)}.dot.q{background:var(--modify)}

h1{font-size:26px;margin:0 0 6px;line-height:1.25}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:18px 0 8px}

section.block{margin:22px 0}section.block>.card{padding:18px 20px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.03em;vertical-align:1px;font-style:normal}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:6px}

.md table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}.md th{background:var(--panel2)}

.md li{margin:3px 0}.md ul,.md ol{padding-left:22px}.md li input[type=checkbox]{margin-right:7px;accent-color:var(--acc)}

.md strong{font-weight:650}.md blockquote{border-left:3px solid var(--line);margin:8px 0;padding:2px 12px;color:var(--mute)}
.review{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}

<script type="application/json" id="plan-data">{"title":"Clara-ready MCP Implementation Plan","meta":{"Goal":"Clara, docked beside Blockout, can stage, frame, light and export a shot using only Blockout's MCP tools. The same tools work from plain `claude`, `codex` and `copilot`.","Architecture":"One tool catalog (`mcp/tools.json`) feeds two transports:\n- the existing zero-dependency stdio bridge, and\n- a new in-process Streamable HTTP server in the Electron main process.\n\nBoth relay each call through the existing control path (`control:invoke` IPC → `src/renderer/control/handler.ts`), so every edit stays undoable and visible live. A main-process controller attaches Clara through `@2dl/clara-client` from a titlebar button.","Tech Stack":"Electron 43, electron-vite, TypeScript, Vitest, Playwright, `@modelcontextprotocol/sdk` ^1.30.0, zod ^4, `@2dl/clara-client` 0.1.0 (vendored tarball).","Spec":"the Design section below. Lior skipped the design questions on 2026-10-19, so each decision is tagged *Lior* or *my call*. Background:\n- the Clara brief, `D:\\Git\\maestro\\docs\\handoffs\\apps\\clara-mcp-handoff.md`\n- the capability check, `.maestro/capabilities/` (local only)"},"blocks":[{"kind":"header","heading":"","body":""},{"kind":"section","heading":"Design","body":"**Why.** The fork exists to produce clean blockout clips for AI video-to-video models (see `CLAUDE.md`). Blockout's MCP can stage a shot but can't deliver one: it has no export, lighting, scenes, colours, mark editing, undo or save. `apply_camera_move` also ignores its `entityId`. Customers will drive Blockout by chatting with Clara, and Clara can only do what the tools allow.\n\n**Decisions**\n- \u003cspan class=\"badge lior\">Lior\u003c/span>\n  - Code uses Blockout's upstream style (2-space indent, single quotes, no semicolons).\n  - The fork stays mergeable with upstream: prefer new files and small hooks into upstream files.\n  - Baseline he did not correct: almost nothing asks first, because store undo covers edits; deletes ask first; Clara gets `read-files` access and opens from a button.\n- \u003cspan class=\"badge lior\">Lior\u003c/span> \u003ci>(DaVinci ruling D7, applied here)\u003c/i> Clara is always a separate install. Blockout never bundles it.\n- \u003cspan class=\"badge lior\">Lior\u003c/span> \u003ci>(DaVinci ruling D1, applied here, my call to carry over)\u003c/i> Claude, Codex, Copilot and Clara all reach Blockout.\n- \u003cspan class=\"badge mine\">My call\u003c/span>\n  - **Transport:** in-process Streamable HTTP on `127.0.0.1:17480`. It gives plain-CLI users a stable URL, and it doesn't depend on a `node` binary on the customer's machine, which the stdio bridge needs.\n  - The stdio bridge stays for upstream compatibility and reads the same catalog.\n- \u003cspan class=\"badge mine\">My call\u003c/span>\n  - **Server shape:** the low-level SDK `Server` with raw JSON schemas, so the catalog stays one JSON file that both transports read. `McpServer.registerTool` would need zod shapes.\n  - **Relay:** tools wrap the existing renderer control actions; no new tool layer.\n  - **CLI registration:** the HTTP server is registered with the CLIs, packaged builds only, as DaVinci does.\n  - **Clara attach:** from a titlebar button, never at startup.\n- \u003cspan class=\"badge mine\">My call\u003c/span>\n  - **Clara's folder:** the open project's folder. With no project open, the button is disabled.\n  - **Export default profile:** `seedance-2`. It is the only current video profile built around a reference video. Profiles for H3 Max, LTX Render-to-Real and Kling V3 Omni are a separate plan.\n  - **Labelled entities** get distinct palette colours automatically, so the model can tell people apart.\n\n**Goals**\n- Fill the tool gaps:\n  - export: shot, frame, contact sheet, scene animatic, plus a profile list\n  - lighting\n  - scenes and shots\n  - an entity's look\n  - camera rig\n  - marks: list, edit, delete\n  - motion per performer\n  - undo, redo, save\n  - richer `get_state`\n- Every tool has a customer-facing `title`, a description, and `readOnlyHint` or `destructiveHint` where it applies.\n- Camera moves and framing honour an explicit subject and never fall back to a set kit.\n- Clara attaches, docks and detaches cleanly. Plain `claude` / `codex` / `copilot` reach the same tools.\n\n**Non-goals:**\n- new target-model profiles or prompt rewrites\n- open roads\n- camera occlusion\n- fight and camera features (plan `2026-10-19-fight-camera.md`)\n- bundling Clara\n\n**Anti-goals:**\n- a tool that can lose work without undo, unless it is marked destructive\n- two catalogs drifting apart\n- an MCP port reachable from another host or a browser page\n\n### Tool catalog: new tools\n\nExisting tools keep their names and params. Tasks 1, 3, 4 and 5 add titles and annotations to the 34 existing tools and add these:\n\n| Tool | Title (customer-facing) | Params (✱ = required) | Annotations | Returns |\n|---|---|---|---|---|\n| `list_export_profiles` | List export targets | — | readOnly | `[{id,name,kind,maxDuration,recommendedDuration,aspects,fps}]` |\n| `export_shot` | Export the shot | `profileId` (default `seedance-2`), `passes` `{clean,depth,normal}` (default clean+depth), `labels` `on\\|stillsOnly\\|off` (default `stillsOnly`), `resolution` `auto\\|720p\\|1080p` (default `auto`) | — | `{packagePath, relativePath, prompt}` |\n| `export_frame` | Export this frame | `profileId`, `resolution`, `labels` (boolean, default true) | — | `{path}` |\n| `export_contact_sheet` | Export a contact sheet | — | — | `{path}` |\n| `export_scene_animatic` | Export the scene animatic | `profileId`, `resolution` | — | `{path}` |\n| `new_scene` | Add a scene | `name` | — | `{sceneId, shotId}` |\n| `select_scene` | Switch scene | `sceneId`✱ | — | `{sceneId, shotId}` |\n| `select_shot` | Switch shot | `shotId`✱ | — | `{shotId}` |\n| `set_lighting` | Change the lighting | `preset`✱ (one of the 9 `LightingPresetId`s), `sunAzimuthDeg`, `sunElevationDeg`, `fog` 0..1 | — | the new environment |\n| `set_entity_style` | Change how something looks | `entityId`✱, `label`, `color` (hex or `red amber green blue purple pink teal orange`), `name`, `heightScale` 0.5..1.5, `build` 0.5..1.5, `hideInExports` | — | the entity summary |\n| `set_camera_rig` | Change the camera rig | `rig`✱ (`sticks dolly steadicam handheld crane drone carMount`), `intensity` 0..1 | — | `{rig, intensity}` |\n| `list_marks` | List timeline marks | `lane`✱ (`camera` or an entity id) | readOnly | marks with ids |\n| `update_mark` | Edit a timeline mark | `lane`✱, `markId`✱, `time`, `x`, `y`, `z`, `gait`, `hold`, `easeIn`, `easeOut`, `panDeg`, `tiltDeg`, `rollDeg`, `focalLength`, `focusDistance` | — | the mark |\n| `delete_marks` | Delete timeline marks | `lane`✱, `markIds`✱ (array) | destructive | `{deleted}` |\n| `apply_motion` | Give performers a move | `entityIds`✱, `presetId`✱ | — | `{applied}` |\n| `undo` / `redo` | Undo / Redo | — | — | `{label}` |\n| `save_project` | Save the project | — | — | `{saved: true}` |\n\nChanges to existing tools:\n- `add_entity` gains an optional `color`.\n- `apply_framing` gains an optional `entityIds`.\n- `apply_camera_move` now honours `entityId`.\n- `get_state` adds:\n  - per-entity `color`\n  - `scene.environment` in degrees\n  - camera mark `id`/`rollDeg`/`hold`/`easeIn`/`easeOut`\n  - `shot.rig`, `shot.rigIntensity`, `shot.trackEntityId`\n  - `allScenes: [{id,name,shots:[{id,name}]}]`, alongside the old `allShots`\n- Annotations on existing tools:\n  - readOnly: `get_state` and every `list_*` tool, and `screenshot`\n  - destructive: `delete_entity`, `clear_camera_marks`, `remove_scan`"},{"kind":"section","heading":"Global Constraints","body":"- **Code style:** Blockout's upstream style in every file. 2-space indent, single quotes, no semicolons, and the existing JSDoc-style block comments. \u003cspan class=\"badge lior\">Lior\u003c/span> \u003ci>2026-10-19\u003c/i>\n- **Mergeability:** prefer new files. Upstream files get small hooks only. Every task adds a line to `MODIFICATIONS.md`. Every modified upstream file keeps or gains the `// Modified … see MODIFICATIONS.md.` first-line header.\n- **No commits:** stage only (`git add`). Lior reviews and commits. Never push. Never use worktrees.\n- **AGENTS.md hard rules:**\n  - `src/engine/` imports no DOM, three or Electron.\n  - Nothing on the `state(t)` path uses unseeded randomness or time.\n  - Every document change goes through `store.mutate(label, fn)` or an existing store action.\n- **Done means:**\n  - `npm run typecheck && npm run lint && npm test` all green; check Vitest's `Test Files` line.\n  - Also `npm run smoke` when a task touches `src/main/`, `SceneManager.ts` or `export/`.\n  - e2e specs run against the built app: `npm run build` first.\n- **Launching Electron:** unset `ELECTRON_RUN_AS_NODE` first (Git Bash: `env -u ELECTRON_RUN_AS_NODE …`).\n- **MCP HTTP server:**\n  - Binds `127.0.0.1`. Default port `17480`; override with `BLOCKOUT_MCP_PORT`, an integer `0` or `1024..65535`.\n  - Paths: `POST /mcp`, `GET /health`.\n  - Returns 403 when the `Host` header isn't `127.0.0.1:\u003cport>` or `localhost:\u003cport>`, and 403 when any `Origin` header is present.\n  - Sets `server.requestTimeout = 0`, because exports run up to 600 s.\n- **Versions:** `@modelcontextprotocol/sdk` `^1.30.0`; `zod` `^4` (SDK peer `^3.25 || ^4`); `@2dl/clara-client` 0.1.0 (peer `electron >=35`).\n- **Clara:**\n  - Windows only (`'win32' === process.platform`); `appId: 'blockout'`; tool names snake_case.\n  - Dev launch only behind `BLOCKOUT_CLARA_DEV` (the Maestro root) and only when `!app.isPackaged`. Never use `CLARA_DEV`.\n- **Copy:** titles and descriptions are written for a non-technical customer. Error messages name the bad value and the tool that lists valid ones."},{"kind":"section","heading":"Review Focus","body":"1. **A second Blockout instance, or another app, holds port 17480.** The app must keep working. The Clara tooltip says the tools aren't available. The first instance's server is untouched. *(Task 6: busy-port test)*\n2. **A tool call while an export is running, or before a project is open.** It must return a clear `isError` result and leave the app usable. *(Task 5: concurrent `export_shot` test)*\n3. **The customer closes Clara, the app quits, or the customer presses the button twice fast.** The state must return to idle with no re-attach loop, and a late handle is detached. *(Task 8: controller tests)*\n4. **A stale or unknown id (entity, mark, scene, shot, profile).** The error must name the id and point to `get_state` / `list_marks` / `list_export_profiles`. *(Tasks 3–5: e2e error tests)*\n5. **A project folder with spaces in its path.** Export paths and Clara's `folder` must pass through verbatim. *(The Task 3 e2e temp dir has a space; Task 8 has a verbatim-folder test.)*"},{"kind":"task","num":1,"heading":"One tool catalog for both transports","body":"\n**Interfaces:**\n- Produces: `mcp/tools.json` holds a JSON array of `{ name: string; title: string; description: string; inputSchema: object; annotations?: { readOnlyHint?: boolean; destructiveHint?: boolean } }`.\n- Later tasks append entries. The catalog test enforces that every entry has a `case '\u003cname>'` in `handler.ts`, and that every `case` has an entry.\n\n- [ ] **Step 1: Write the failing test** `tests/unit/mcp-catalog.test.ts`. Read `mcp/tools.json` and `src/renderer/control/handler.ts` with `fs.readFileSync`.\n\n```ts\nconst READ_ONLY = ['get_state', 'list_assets', 'list_action_presets', 'list_sequence_styles', 'list_choreography_options', 'list_motion_presets', 'list_camera_moves', 'list_presets', 'screenshot']\nconst DESTRUCTIVE = ['delete_entity', 'clear_camera_marks', 'remove_scan']\n\nit('every tool is well-formed', () => {\n  for (const t of tools) {\n    expect(t.name).toMatch(/^[a-z][a-z0-9_]*$/)\n    expect(t.title.length).toBeGreaterThan(0)\n    expect(t.description.length).toBeGreaterThan(0)\n    expect(t.inputSchema.type).toBe('object')\n    expect(t.inputSchema.additionalProperties).toBe(false)\n  }\n  expect(new Set(tools.map((t) => t.name)).size).toBe(tools.length)\n})\nit('annotations match the read-only and destructive sets', () => { /* READ_ONLY ⇒ readOnlyHint true; DESTRUCTIVE ⇒ destructiveHint true; no tool has both */ })\nit('catalog and renderer handler cover each other', () => {\n  // top-level action cases only (4-space indent inside execute()); nested switches must not count\n  const cases = [...handlerSrc.matchAll(/^    case '([a-z_]+)'/gm)].map((m) => m[1])\n  expect(new Set(cases)).toEqual(new Set(tools.map((t) => t.name)))\n})\n```\n\n- [ ] **Step 2: Run it.** `npx vitest run tests/unit/mcp-catalog.test.ts` should FAIL: `mcp/tools.json` doesn't exist yet.\n\n- [ ] **Step 3: Move the 34 `TOOLS` entries verbatim into `mcp/tools.json`.** Add a `title` to each, plus the annotations above. In `blockout-mcp.mjs`, replace the array with `JSON.parse(readFileSync(new URL('./tools.json', import.meta.url), 'utf-8'))`. In `tools/list`, strip nothing: clients accept `title` and `annotations`. Add `- tools.json` to the `mcp` filter in `electron-builder.yml`.\n\n- [ ] **Step 4: Run the tests.** `npx vitest run tests/unit/mcp-catalog.test.ts` should PASS. Then run `printf '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}\\n' | node mcp/blockout-mcp.mjs | node -e \"process.stdin.on('data',d=>console.log(JSON.parse(d).result.tools.length))\"`. It should print `34`.\n\n- [ ] **Step 5: Log and stage.** Add a `MODIFICATIONS.md` line, then `git add mcp/ electron-builder.yml tests/unit/mcp-catalog.test.ts MODIFICATIONS.md`. Do not commit.","files":[{"kind":"Create","text":"`mcp/tools.json`"},{"kind":"Modify","text":"`mcp/blockout-mcp.mjs` (the `TOOLS` array, ~lines 43–486; tool list and lookup)"},{"kind":"Modify","text":"`electron-builder.yml` (`extraResources` → `mcp` filter)"},{"kind":"Test","text":"`tests/unit/mcp-catalog.test.ts`"}],"steps":5},{"kind":"task","num":2,"heading":"Camera moves and framing honour an explicit subject","body":"\n**Interfaces:**\n- Produces: `pickFramingSubjectIds(entities: { id: string; assetId: string }[], selectedIds: string[], minSelected: number): string[]`\n- Produces: `SceneManager.applyCameraMove(presetId: string, subjectId?: string): void`\n- Produces: `SceneManager.applyFraming(kind: FramingKind, subjectIds?: string[]): void`\n\nRules for `pickFramingSubjectIds`, in order. Results keep scene order.\n1. If at least `minSelected` selected ids exist in `entities`, return them.\n2. Otherwise return every `person.*`.\n3. Otherwise return the first two entities whose `assetId` doesn't start with `env.`.\n4. Otherwise return `[]`.\n\n- [ ] **Step 1: Write the failing unit tests.**\n  - `single selected vehicle with minSelected 1 → [car]`\n  - `single selected vehicle with minSelected 2 → people when present`\n  - `nothing selected, only env + 2 cars → the 2 cars, never the env kit`\n  - `selected id not in scene is ignored`\n  - `only an env kit → []`\n\n- [ ] **Step 2: Run them.** `npx vitest run tests/unit/framing-subjects.test.ts` should FAIL: the module is missing.\n\n- [ ] **Step 3: Implement `pickFramingSubjectIds`.** In `SceneManager`:\n  - `framingSubjects(minSelected = 2, explicitIds?: string[])` delegates to it, with `explicitIds` taking the place of the selection when given.\n  - `applyCameraMove(presetId, subjectId?)` uses `[subjectId]`, or else `framingSubjects(1)[0]`.\n  - `applyFraming(kind, subjectIds?)` passes `subjectIds` through.\n\n  In the handler:\n  - `apply_camera_move` passes `entityId` as `subjectId` instead of changing the selection.\n  - `apply_framing` validates `entityIds` and passes them.\n\n- [ ] **Step 4: Write the e2e test** in `tests/e2e/mcp-gaps.spec.ts`. Copy the launch and `rpc()` pattern from `tests/e2e/control-tools.spec.ts`, with these changes:\n  - Set `BLOCKOUT_CONFIG_DIR` to a temp dir in the app env.\n  - Read discovery with `resolveConfigPath('control.json', { env })` from `src/shared/config-paths`; the old spec hardcodes `~/.config`, which is wrong on Windows.\n  - Make the smoke dir name contain a space.\n\n  Test `apply_camera_move follows the entity it is given`:\n  1. Spawn `carChase` with 2 cars in `env.residentialStreet`.\n  2. Call `apply_camera_move` with `follow-behind` and the lead car's id.\n  3. Expect `shot().camera.trackEntityId` to equal that id, checked through `page.evaluate`.\n  4. Repeat without `entityId` and expect a `vehicle.*` id, not the env kit.\n\n- [ ] **Step 5: Run it.**\n  - `npx vitest run tests/unit/framing-subjects.test.ts` should PASS.\n  - `npm run build && npx playwright test tests/e2e/mcp-gaps.spec.ts` should PASS.\n  - `npm run smoke` should PASS.\n\n- [ ] **Step 6: Log and stage.** Add a `MODIFICATIONS.md` line and stage the files.","files":[{"kind":"Create","text":"`src/engine/framing.ts`"},{"kind":"Modify","text":"`src/renderer/viewport/SceneManager.ts:1480-1500` (`framingSubjects`), `:1553` (`applyFraming`) and `:1704` (`applyCameraMove`)"},{"kind":"Modify","text":"`src/renderer/control/handler.ts` (`apply_framing`, `apply_camera_move` cases)"},{"kind":"Modify","text":"`mcp/tools.json` (add `entityIds` to `apply_framing`)"},{"kind":"Test","text":"`tests/unit/framing-subjects.test.ts`, `tests/e2e/mcp-gaps.spec.ts` (new file; later tasks add to it)"}],"steps":6},{"kind":"task","num":3,"heading":"Scene, lighting, look and rig tools","body":"\n**Interfaces:**\n- Produces:\n  - `LABEL_SWATCHES: string[]`, the same 8 hex values in the same order as `Inspector.tsx:40`\n  - `LABEL_COLOR_NAMES: Record\u003c'red'|'amber'|'green'|'blue'|'purple'|'pink'|'teal'|'orange', string>`\n  - `nextLabelColor(used: string[]): string`, the first swatch not in `used`, or `LABEL_SWATCHES[used.length % 8]` when all are used\n  - `resolveColor(input: string): string | null`, which takes a name or `#rrggbb`, and returns `null` otherwise\n- Produces handler cases: `new_scene`, `select_scene`, `select_shot`, `set_lighting`, `set_entity_style`, `set_camera_rig`.\n\n- [ ] **Step 1: Write the failing unit tests.** Cover `nextLabelColor` with an empty list, a partly used list and a full list. Cover `resolveColor` with `'red'` → `'#e5484d'`, `'#AbCdEf'` → `'#abcdef'`, and `'banana'` → `null`.\n\n- [ ] **Step 2: Run them.** `npx vitest run tests/unit/palette.test.ts` should FAIL.\n\n- [ ] **Step 3: Implement `palette.ts` and the six cases.** Store paths:\n  - `addSceneAfter`, then return the new scene's first shot.\n  - `selectScene`, `selectShot`.\n  - `mutate` on `scene.environment`; degrees in, radians stored.\n  - `mutate` on `entity.label` / `entity.name` / `entity.params.height` / `entity.params.build` / `entity.excludeFromExport`.\n  - `mutate` on `shot.camera.rig` / `rigIntensity`.\n\n  `add_entity` with a label and no `color` uses `nextLabelColor` over the scene's labelled entities. Extend `summary()` as described in Design. Clamp numeric params to the ranges in the table. An unknown preset, rig or colour gets an error listing the valid values.\n\n- [ ] **Step 4: Write the e2e tests.**\n  - Two labelled `add_entity` calls get different colours.\n  - `set_lighting goldenHourSky` shows in `get_state`.\n  - `new_scene` then `select_scene` round-trips.\n  - `set_entity_style color: 'red'` gives `#e5484d`.\n  - `select_scene` with a bad id gets an error mentioning `get_state`.\n\n- [ ] **Step 5: Run everything.**\n  - `npm test` should pass, with `Test Files` all passed.\n  - `npm run build && npx playwright test tests/e2e/mcp-gaps.spec.ts` should PASS.\n\n- [ ] **Step 6: Log and stage.**","files":[{"kind":"Create","text":"`src/engine/palette.ts`"},{"kind":"Modify","text":"`src/renderer/panels/Inspector.tsx:40` (import `LABEL_SWATCHES` instead of the local `SWATCHES`)"},{"kind":"Modify","text":"`src/renderer/control/handler.ts` (`summary()`, `add_entity`, and new cases)"},{"kind":"Modify","text":"`mcp/tools.json`"},{"kind":"Test","text":"`tests/unit/palette.test.ts`, `tests/e2e/mcp-gaps.spec.ts`"}],"steps":6},{"kind":"task","num":4,"heading":"Marks, motion and history tools","body":"\n**Interfaces:**\n- Consumes:\n  - `useStore` actions `applyMotionToEntities`, `undo`, `redo`, `markSaved`\n  - `currentProjectJson()` (`store.ts:1220`)\n  - `window.blockout.saveProject`\n- Produces handler cases: `list_marks`, `update_mark`, `delete_marks`, `apply_motion`, `undo`, `redo`, `save_project`.\n- Lane resolution: `'camera'` means `shot.camera.marks`. Otherwise it is the active take's track for that entity, where the take is `scene.blocking.find(b => b.id === shot.blockingTakeId)`.\n\n- [ ] **Step 1: Write the failing e2e tests.**\n  - `list_marks camera` returns ids sorted by time.\n  - `update_mark` moves a camera mark to `time: 2.5, focalLength: 50`, and `list_marks` shows it.\n  - `delete_marks` with 1 id leaves n−1 marks.\n  - `update_mark` with an unknown `markId` gets an error mentioning `list_marks`.\n  - `apply_motion` with `jab-cross` on a man gives `applied: 1`.\n  - `undo` reverts the last edit.\n  - `save_project` writes the project file; check it with `existsSync` in the smoke dir.\n\n- [ ] **Step 2: Run them.** `npm run build && npx playwright test tests/e2e/mcp-gaps.spec.ts` should FAIL with \"Unknown action\".\n\n- [ ] **Step 3: Implement the seven cases.**\n  - Do every edit in one `s.mutate('agent: …', fn)`.\n  - `update_mark` clamps `time` to `[0, shot.duration]` and re-sorts the lane.\n  - `apply_motion` returns `applied: 0` with an error if no id is a `person.*`.\n  - `save_project` returns an error if `projectFolder` is null.\n\n- [ ] **Step 4: Run them.** The same command should PASS. `npm test` should PASS (the catalog test covers the new cases).\n\n- [ ] **Step 5: Log and stage.**","files":[{"kind":"Modify","text":"`src/renderer/control/handler.ts`"},{"kind":"Modify","text":"`mcp/tools.json`"},{"kind":"Test","text":"`tests/e2e/mcp-gaps.spec.ts`"}],"steps":5},{"kind":"task","num":5,"heading":"Export tools","body":"\n**Interfaces:**\n- Consumes:\n  - `exportShot`, `exportStillAtPlayhead`, `exportContactSheet`, `exportAnimatic` (`src/renderer/export/exporter.ts:239/386/467/421`)\n  - `BUILTIN_PROFILES`, `generatePrompt`\n- Produces handler cases: `list_export_profiles`, `export_shot`, `export_frame`, `export_contact_sheet`, `export_scene_animatic`.\n- `profileId` is validated against `BUILTIN_PROFILES`; `getProfile` silently falls back to the first profile, so it can't be relied on.\n\n- [ ] **Step 1: Write the failing e2e tests.**\n  - `export_shot` with defaults returns `ok`.\n  - `packagePath` contains `\u003cshot>_reference.mp4`, `\u003cshot>_depth.mp4` and `prompt.txt`.\n  - `relativePath` starts with `exports/`.\n  - `prompt` equals the file's text, trimmed.\n  - `export_shot profileId: 'nope'` gets an error mentioning `list_export_profiles`.\n  - Two `export_shot` calls sent together through `Promise.all` give exactly one `ok` and one `An export is already running.`\n\n- [ ] **Step 2: Run them.** They should FAIL.\n\n- [ ] **Step 3: Implement the five cases and the timeout change.** `relativePath` is `packagePath` relative to `projectFolder`, with forward slashes.\n\n- [ ] **Step 4: Run them.**\n  - `npm run build && npx playwright test tests/e2e/mcp-gaps.spec.ts` should PASS.\n  - `npm run smoke` should PASS, because `control.ts` changed.\n\n- [ ] **Step 5: Log and stage.**","files":[{"kind":"Modify","text":"`src/renderer/control/handler.ts`"},{"kind":"Modify","text":"`src/main/control.ts:31-35` (`timeoutForAction`: any `export_` action gets 600_000)"},{"kind":"Modify","text":"`mcp/tools.json`"},{"kind":"Test","text":"`tests/e2e/mcp-gaps.spec.ts`"}],"steps":5},{"kind":"task","num":6,"heading":"In-process HTTP MCP server","body":"\n**Interfaces:**\n- Consumes: `mcp/tools.json` (Task 1), imported through `resolveJsonModule`.\n- Produces in `src/main/mcp-http.ts`. It must not import `electron`; the tests run under Node.\n  - `type InvokeFn = (action: string, params: unknown) => Promise\u003c{ ok: boolean; data?: unknown; error?: string }>`\n  - `interface McpToolDef { name: string; title: string; description: string; inputSchema: Record\u003cstring, unknown>; annotations?: { readOnlyHint?: boolean; destructiveHint?: boolean } }`\n  - `interface McpHttpStatus { state: 'stopped' | 'listening' | 'error'; port?: number; url?: string; message?: string }`\n  - `interface McpHttpServer { start(port: number): Promise\u003cMcpHttpStatus>; stop(): Promise\u003cvoid>; status(): McpHttpStatus }`, where `start` never rejects\n  - `createMcpHttpServer(opts: { invoke: InvokeFn; version: string; tools: McpToolDef[] }): McpHttpServer`\n  - `toToolResult(response): CallToolResult`. A `data.imageBase64` string becomes one `image` content (`image/png`). Otherwise the result is one `text` content with `JSON.stringify(response)`, and `isError` is `response.ok === false`. This mirrors `blockout-mcp.mjs:550-560`.\n  - `MCP_DEFAULT_PORT = 17480`, `resolveMcpPort(env: NodeJS.ProcessEnv): number`\n- Produces in `src/main/control.ts`: `startControlServer(getWindow): Promise\u003c{ invoke: InvokeFn }>`.\n\nPer request:\n1. Build a fresh low-level `Server({ name: 'blockout', version }, { capabilities: { tools: {} } })`.\n2. Register `ListToolsRequestSchema` → `{ tools }`.\n3. Register `CallToolRequestSchema`: an unknown name gets an `isError` text `Unknown tool: \u003cname>`; otherwise `toToolResult(await invoke(name, args))`.\n4. Create `StreamableHTTPServerTransport({ sessionIdGenerator: undefined, enableJsonResponse: true })`.\n5. Close both on `res` `close`.\n\n- [ ] **Step 1: Install the dependencies.** `npm i @modelcontextprotocol/sdk@^1.30.0 zod@^4`. Expect `package.json` `dependencies` to list both.\n\n- [ ] **Step 2: Write the failing unit tests** in `tests/unit/mcp-http.test.ts`, with a fake `invoke`, `start(0)` and the SDK's `Client` + `StreamableHTTPClientTransport`.\n  - `lists exactly the catalog`: tool count equals `tools.json` length.\n  - `relays a call`: `callTool get_state` reaches the fake as `('get_state', {})`, and the text parses to the fake's response.\n  - `screenshot becomes an image`: the fake returns `{ ok: true, data: { imageBase64: 'iVBO' } }`, and the result has `content[0].type === 'image'`.\n  - `failed action is isError`.\n  - `rejects a foreign Host`: a raw `http.request` with `host: 'evil.example:\u003cport>'` gets 403, and the fake was never called.\n  - `rejects any Origin`: 403.\n  - `GET /mcp is 405 with Allow: POST`; `unknown path is 404`; `GET /health is 200` with `{ ok: true, app: 'blockout' }`.\n  - `busy port reports error`: hold a port with `net.createServer().listen(0)`, and `start(thatPort)` resolves `{ state: 'error' }` with a message containing `EADDRINUSE`.\n  - `stop refuses new requests`.\n  - `resolveMcpPort`: unset → 17480, `'0'` → 0, `'80'` → 17480, `'abc'` → 17480.\n\n- [ ] **Step 3: Run them.** `npx vitest run tests/unit/mcp-http.test.ts` should FAIL.\n\n- [ ] **Step 4: Implement `mcp-http.ts`.** Set `server.requestTimeout = 0`. Put the Host and Origin check first in the handler; the SDK's `allowedHosts` options are deprecated. Then wire `index.ts`:\n  - `const control = await startControlServer(() => mainWindow)`\n  - `const mcp = createMcpHttpServer({ invoke: control.invoke, version: APP_VERSION, tools })`\n  - `void mcp.start(resolveMcpPort(process.env))`\n  - `app.on('before-quit', () => void mcp.stop())`\n  - Keep a module-level getter for Task 8.\n\n- [ ] **Step 5: Write the e2e test** `MCP over HTTP reaches the running app`:\n  1. Pick a free port by listening on 0 and closing it.\n  2. Launch with `BLOCKOUT_MCP_PORT` set to it.\n  3. Connect `Client` over HTTP, `listTools` (count equals `tools.json`), and `callTool get_state` (`ok`).\n\n- [ ] **Step 6: Run everything.** `npm test`, `npm run build && npx playwright test tests/e2e/mcp-gaps.spec.ts`, and `npm run smoke` should all PASS.\n\n- [ ] **Step 7: Document, log and stage.**\n  - `mcp/README.md`: add `claude mcp add --transport http --scope user blockout http://127.0.0.1:17480/mcp` and the `codex` and `copilot` equivalents.\n  - `AGENTS.md`: update the tool table.\n  - Add a `MODIFICATIONS.md` line, then stage.","files":[{"kind":"Create","text":"`src/main/mcp-http.ts`"},{"kind":"Modify","text":"`src/main/control.ts:37` (`startControlServer` returns `{ invoke }`)"},{"kind":"Modify","text":"`src/main/index.ts:55-64` (start after the control server; stop on `before-quit`)"},{"kind":"Modify","text":"`package.json` (dependencies)"},{"kind":"Modify","text":"`mcp/README.md` (an \"HTTP transport\" section), `AGENTS.md` (the MCP tool table and the new tools)"},{"kind":"Test","text":"`tests/unit/mcp-http.test.ts`, `tests/e2e/mcp-gaps.spec.ts`"}],"steps":7},{"kind":"task","num":7,"heading":"Register the HTTP server with claude, codex and copilot","body":"\n**Interfaces:**\n- Produces:\n  - `type ExecFn = (file: string, args: string[]) => Promise\u003c{ code: number | null; stdout: string; stderr: string; notFound: boolean }>`\n  - `registerWithClis(opts: { name: string; url: string; version: string; markerPath: string; exec?: ExecFn; log?: (line: string) => void }): Promise\u003cstring[]>`, which returns the CLIs recorded and never rejects\n- Commands, copied from DaVinci's `CliRegistration.ts`:\n  - claude: `mcp get \u003cn>` / `mcp add --transport http --scope user \u003cn> \u003curl>` / `mcp remove --scope user \u003cn>`\n  - codex: `mcp get \u003cn>` / `mcp add \u003cn> --url \u003curl>` / `mcp remove \u003cn>`\n  - copilot: `mcp get \u003cn>` / `mcp add --transport http \u003cn> \u003curl>` / `mcp remove \u003cn>`\n- Default exec: `execFile(file, args, { shell: true, windowsHide: true, timeout: 60_000 })`. `notFound` is true on `ENOENT`, exit 9009 or 127, or \"not recognized\" in stderr.\n- The marker JSON is `{ url, version, registered: string[] }`.\n\n- [ ] **Step 1: Write the failing tests, using a fake exec.**\n  - A CLI that isn't installed is skipped and not recorded.\n  - `get` exits 0 and its stdout contains the url: no `add`, and the CLI is recorded.\n  - `get` exits 0 with another url: `remove` then `add`.\n  - `get` exits non-zero: `add`.\n  - `add` fails: the CLI isn't recorded, and one log line is written.\n  - The marker matches url + version and lists all three: zero exec calls.\n  - The url changed: all three are re-checked.\n  - exec throws: the call resolves anyway.\n\n- [ ] **Step 2: Run them.** `npx vitest run tests/unit/cli-registration.test.ts` should FAIL.\n\n- [ ] **Step 3: Implement it and wire `index.ts`.**\n  - Run only when `app.isPackaged` and the status is `listening`.\n  - Set `name: 'blockout'` and `markerPath: join(app.getPath('userData'), 'mcp-registration.json')`.\n  - Append log lines to `\u003cuserData>/logs/mcp-registration.log`, keeping the last 200 lines.\n  - Note in `mcp/README.md`: a user's earlier stdio registration named `blockout` is replaced by the HTTP one, which has the same tools.\n\n- [ ] **Step 4: Run it.** `npm test` should PASS.\n\n- [ ] **Step 5: Log and stage.**","files":[{"kind":"Create","text":"`src/main/cli-registration.ts`"},{"kind":"Modify","text":"`src/main/index.ts` (packaged builds only, after `mcp.start` reports `listening`)"},{"kind":"Test","text":"`tests/unit/cli-registration.test.ts`"}],"steps":5},{"kind":"task","num":8,"heading":"Attach Clara from the titlebar","body":"\n**Interfaces:**\n- Produces in `src/shared/clara-types.ts`:\n  - `type ClaraState = 'unsupported' | 'idle' | 'attaching' | 'attached' | 'not-installed' | 'failed'`\n  - `interface ClaraView { state: ClaraState; error: string | null; folder: string | null; mcpError: string | null }`\n- Produces in `src/main/clara.ts`. Its deps are injected, and it imports nothing from `electron` at module level. The type-only imports `AttachClara`, `IHostWindow`, `IClaraAttachOptions` and `IAttachDeps` come from `@2dl/clara-client`.\n  - `createClaraController(deps: { attach: typeof AttachClara; getWindow(): IHostWindow | null; getMcp(): McpHttpStatus; env: NodeJS.ProcessEnv; platform: NodeJS.Platform; isPackaged: boolean; onChange(view: ClaraView): void; setTimer?: (fn: () => void, ms: number) => void }): { getState(): ClaraView; toggle(folder: string | null): Promise\u003cClaraView> }`\n  - `buildAttachOptions(folder: string, mcpUrl: string): IClaraAttachOptions`\n  - `devAttachDeps(env, isPackaged): IAttachDeps | undefined`\n  - `CLARA_RETRY_MS = 3000`\n- Produces IPC:\n  - `clara:getState` → `ClaraView`\n  - `clara:toggle (folder: string | null)` → `ClaraView`\n  - push `clara:state` (`ClaraView`)\n- Produces preload: `window.blockout.clara.{ getState(): Promise\u003cClaraView>; toggle(folder: string | null): Promise\u003cClaraView>; onState(cb: (v: ClaraView) => void): () => void }`\n\nAttach options (exact):\n```ts\n{\n  appId: 'blockout',\n  appName: 'Blockout',\n  folder,                                   // the open project's folder, verbatim\n  mcp: { type: 'http', url: mcpUrl },       // the listening url, or http://127.0.0.1:\u003cresolveMcpPort(env)>/mcp so Clara can offer Retry\n  access: 'read-files',\n  instructions: CLARA_INSTRUCTIONS\n}\n```\n`CLARA_INSTRUCTIONS` (exact copy): \"You help filmmakers block shots in Blockout, a grey-box 3D previs app, and export clips that AI video models use as their input video. Call get_state first. Units are meters and seconds; +X is right and -Z is away from the default camera. Every change can be undone. After staging or moving the camera, call screenshot to check the shot before you export. Give each character a different colour and a short label so the video model can tell them apart.\"\n\nController behaviour:\n- On a platform other than `win32`: `unsupported`, and `toggle` is a no-op.\n- From `idle`, `failed` or `not-installed`, `toggle(folder)` moves to `attaching`, then `attached` / `not-installed` / `failed`. An empty or null folder stays `idle` with the error `Open a project first`.\n- `failed` gets one retry after `CLARA_RETRY_MS`; `not-installed` gets none.\n- `toggle` while `attaching` bumps a generation counter. The handle that arrives late is `Detach()`ed, and the state goes to `idle`.\n- `toggle` while `attached` calls `handle.Detach()` and moves to `idle`.\n- `closed` from the current handle moves to `idle`; a stale handle is ignored.\n- `mcpError` holds the MCP status `message` when the state is `error`.\n\nDev deps, only when `!isPackaged` and `BLOCKOUT_CLARA_DEV` is set:\n```ts\n{\n  launch: {\n    command: \u003croot>\\node_modules\\electron\\dist\\electron.exe,\n    args: [\u003croot>\\out-clara\\main\\index.js]\n  },\n  pipeSuffix: env.CLARA_PIPE_SUFFIX ?? 'blockout-dev'\n}\n```\n\nButton tooltips (exact):\n\n| State | Tooltip |\n|---|---|\n| attaching | `Opening Clara…` |\n| attached | `Clara is open. Click to close it.` |\n| not-installed | `Clara isn't installed on this computer.` |\n| failed | `Clara couldn't open: \u003cerror>. Click to try again.` |\n| idle | `Open Clara`, or `Open a project first` |\n| any, with `mcpError` | adds ` Blockout's tools aren't available: \u003cmcpError>.` |\n\nThe button is hidden while the state is `unsupported`, and `.clara-pulse` runs while attaching.\n\n- [ ] **Step 1: Vendor the client.**\n  1. `cp D:/Git/Artist/vendor/2dl-clara-client-0.1.0.tgz vendor/`. This only reads from Artist; never build or edit there.\n  2. `npm i ./vendor/2dl-clara-client-0.1.0.tgz`.\n  3. Expect `package.json` to show `\"@2dl/clara-client\": \"file:vendor/2dl-clara-client-0.1.0.tgz\"` under `dependencies`.\n  4. `node -e \"console.log(typeof require('@2dl/clara-client').AttachClara)\"` should print `function`.\n\n- [ ] **Step 2: Write the failing controller tests**, using a fake `attach`, a fake window and `vi.useFakeTimers()`.\n  - Not Windows gives `unsupported`, and attach is never called.\n  - A null folder stays idle with `Open a project first`.\n  - A success gives `attached`, and the options equal `buildAttach <script>
const D = JSON.parse(document.getElementById('plan-data').textContent)
const KEY = 'plan-review:' + D.file
let S = {}
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {} }
const md = (s) => marked.parse(s || '', { gfm: true })
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const plain = (s) => String(s).split(String.fromCharCode(96)).join('')
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
const tasks = D.blocks.filter((b) => b.kind === 'task')
const sections = D.blocks.filter((b) => b.kind === 'section')
const before = sections.filter((s) => D.blocks.indexOf(s) < D.blocks.indexOf(tasks[0]))
const after = sections.filter((s) => D.blocks.indexOf(s) > D.blocks.indexOf(tasks[0]))
const totalSteps = tasks.reduce((n, t) => n + t.steps, 0)

function reviewBox(id) {
  return '<div class="review" data-id="' + id + '">' +
    '<button data-v="ok" class="ok">✓ Looks good</button>' +
    '<button data-v="change" class="change">✎ Change this</button>' +
    '<button data-v="q" class="q">? Question</button>' +
    '<textarea placeholder="Notes for Claude (optional)…"></textarea></div>'
}

let h = '<h1>' + esc(D.title) + '</h1><div class="sub">Generated from <code>docs/plans/' + D.file + '.md</code> · ' + D.generated + '</div>'
h += '<div class="hero">'
for (const k of ['Goal', 'Architecture', 'Depends on']) if (D.meta[k]) h += '<div class="card"><b class="k">' + k + '</b><div class="md">' + md(D.meta[k]) + '</div></div>'
h += '</div><div class="stats"><span class="stat">' + tasks.length + ' tasks</span><span class="stat">' + totalSteps + ' steps</span>' +
  (D.meta['Tech Stack'] ? '<span class="stat">' + esc(D.meta['Tech Stack'].replace(/\n/g, ' ')) + '</span>' : '') + '</div>'
h += '<div class="legend"><span><span class="badge lior">Lior</span> your ruling</span><span><span class="badge mine">My call</span> my decision, please check</span></div>'
h += '<section class="block" id="architecture"><h2>Architecture</h2><div class="diagram"><pre class="mermaid">' + esc(D.arch) + '</pre></div></section>'
h += '<section class="block" id="order"><h2>Task order</h2><div class="diagram"><pre class="mermaid">' + esc(D.deps) + '</pre></div></section>'
const renderSection = (s) => {
  const id = slug(s.heading)
  return '<section class="block" id="' + id + '"><div class="card"><h2>' + esc(s.heading) + '</h2><div class="md">' + md(s.body) + '</div>' + reviewBox(id) + '</div></section>'
}
for (const s of before) h += renderSection(s)
for (const t of tasks) {
  const id = 'task-' + t.num
  h += '<section class="block" id="' + id + '"><div class="card task"><header><span class="num">' + t.num + '</span><h2>' + esc(t.heading) +
    '</h2><span class="meta">' + t.steps + ' steps · ' + t.files.length + ' files</span></header>'
  if (t.files.length) {
    h += '<div class="files">'
    for (const f of t.files) h += '<div class="file"><span class="k ' + f.kind + '">' + f.kind + '</span><span class="md">' + marked.parseInline(f.text) + '</span></div>'
    h += '</div>'
  }
  h += '<div class="md">' + md(t.body) + '</div>' + reviewBox(id) + '</div></section>'
}
for (const s of after) h += renderSection(s)
document.getElementById('main').innerHTML = h

function navHtml() {
  const dot = (id) => '<span class="dot ' + ((S[id] && S[id].v) || '') + '"></span>'
  let n = '<div style="font-weight:700;margin-bottom:6px">' + esc(D.short) + '</div><a href="#architecture">' + dot('_') + 'Architecture</a><a href="#order">' + dot('_') + 'Task order</a>'
  n += '<div class="grp">Design</div>'
  for (const s of before) n += '<a href="#' + slug(s.heading) + '">' + dot(slug(s.heading)) + esc(s.heading) + '</a>'
  n += '<div class="grp">Tasks</div>'
  for (const t of tasks) n += '<a href="#task-' + t.num + '">' + dot('task-' + t.num) + t.num + ' · ' + esc(plain(t.heading)) + '</a>'
  if (after.length) n += '<div class="grp">More</div>'
  for (const s of after) n += '<a href="#' + slug(s.heading) + '">' + dot(slug(s.heading)) + esc(s.heading) + '</a>'
  document.getElementById('nav').innerHTML = n
}
navHtml()

for (const box of document.querySelectorAll('.review')) {
  const id = box.dataset.id
  const ta = box.querySelector('textarea')
  const paint = () => box.querySelectorAll('button').forEach((b) => b.classList.toggle('on', !!S[id] && S[id].v === b.dataset.v))
  if (S[id]) ta.value = S[id].note || ''
  paint()
  box.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    S[id] = S[id] || {}
    S[id].v = S[id].v === b.dataset.v ? '' : b.dataset.v
    save(); paint(); navHtml()
  }))
  ta.addEventListener('input', () => { S[id] = S[id] || {}; S[id].note = ta.value; save() })
}

const toast = (t) => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800) }
const label = { ok: 'OK', change: 'CHANGE', q: 'QUESTION' }
document.getElementById('copy').addEventListener('click', async () => {
  const titleOf = (id) => {
    const t = tasks.find((x) => 'task-' + x.num === id)
    if (t) return 'Task ' + t.num + ' (' + t.heading + ')'
    const s = sections.find((x) => slug(x.heading) === id)
    return s ? s.heading : id
  }
  const order = [...before.map((s) => slug(s.heading)), ...tasks.map((t) => 'task-' + t.num), ...after.map((s) => slug(s.heading))]
  const lines = order.filter((id) => S[id] && (S[id].v || (S[id].note || '').trim()))
    .map((id) => '- ' + titleOf(id) + ': ' + (label[S[id].v] || 'NOTE') + ((S[id].note || '').trim() ? ' — ' + S[id].note.trim().replace(/\n+/g, ' / ') : ''))
  const text = 'Review of docs/plans/' + D.file + '.md\n' + (lines.length ? lines.join('\n') : '- (no marks yet)')
  try { await navigator.clipboard.writeText(text); toast('Review copied — paste it to Claude') }
  catch (e) { prompt('Copy your review:', text) }
})
document.getElementById('clear').addEventListener('click', () => { S = {}; save(); location.reload() })

const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light'
mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', flowchart: { htmlLabels: true, curve: 'basis' }, securityLevel: 'loose' })
mermaid.run({ querySelector: '.mermaid' })
document.querySelectorAll('.md pre code').forEach((el) => { try { hljs.highlightElement(el) } catch (e) {} })
</script></body></html>
